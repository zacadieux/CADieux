<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CADieux</title>
<meta name="theme-color" content="#1e293b">
<meta name="description" content="CADieux - 2D plan and 3D home design with framing, roofs, stairs, decks, cabinets and a materials list.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f6f6f2;
  --panel: #fff;
  --ink: #222;
  --mute: #666;
  --line: #d8d8d0;
  --grid: #e2e2da;
  --grid5: #c9c9bf;
  --wall: #5a5a5f;
  --room: #dfe9f4;
  --accent: #2f6fdb;
  --btn: #ecece6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1f;
    --panel: #25262a;
    --ink: #eee;
    --mute: #9a9a9a;
    --line: #3a3b40;
    --grid: #2e2f34;
    --grid5: #44464c;
    --wall: #b8b8c0;
    --room: #2c3a4d;
    --btn: #33353b;
  }
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    14px system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  height: 100%;
}
#logo {
  width: 36px;
  height: 36px;
  flex: none;
  border: 1px dashed var(--line);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  font-size: 9px;
  color: var(--mute);
  letter-spacing: 0.5px;
}
#logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
#bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  align-items: center;
}
button {
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  font: inherit;
  cursor: pointer;
}
#filem {
  position: relative;
}
#filepop {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: 4px;
  z-index: 50;
  flex-direction: column;
  gap: 2px;
  padding: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
  min-width: 110px;
}
#filepop.open {
  display: flex;
}
#filepop button {
  text-align: left;
}
#vm {
  display: inline-flex;
}
#vm button {
  border-radius: 0;
  margin-left: -1px;
}
#vm button:first-child {
  border-radius: 6px 0 0 6px;
  margin-left: 0;
}
#vm button:last-child {
  border-radius: 0 6px 6px 0;
}
button.on {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
select {
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px;
  font: inherit;
}
.sep {
  width: 1px;
  height: 22px;
  background: var(--line);
  margin: 0 4px;
}
#main {
  --a: 1fr;
  --b: 1fr;
  flex: 1;
  display: grid;
  grid-template-columns: 52px minmax(0, var(--a)) minmax(0, var(--b)) 250px;
  min-height: 0;
}
#main.nos {
  grid-template-columns: 52px minmax(0, var(--a)) minmax(0, var(--b));
}
#split {
  position: absolute;
  top: 0;
  bottom: 0;
  right: -4px;
  width: 8px;
  cursor: col-resize;
  z-index: 20;
  touch-action: none;
}
#split::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 2px;
  width: 4px;
  height: 36px;
  margin-top: -18px;
  border-radius: 2px;
  background: var(--line);
}
#split:hover::after,
#split.drag::after {
  background: var(--accent, #2f6fdb);
}
#main.v2d #split,
#main.v3d #split {
  display: none;
}
#main.nos #side {
  display: none;
}
#rail {
  grid-column: 1;
}
#p2 {
  grid-column: 2;
}
#p3 {
  grid-column: 3;
}
#side {
  grid-column: 4;
}
#main.v2d {
  grid-template-columns: 52px 1fr 0 250px;
}
#main.v3d {
  grid-template-columns: 52px 0 1fr 250px;
}
#main.v2d.nos {
  grid-template-columns: 52px 1fr 0;
}
#main.v3d.nos {
  grid-template-columns: 52px 0 1fr;
}
#main.v2d #p3,
#main.v3d #p2 {
  display: none;
}
#rail {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 4px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow: auto;
}
#rail button {
  width: 100%;
  padding: 6px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  line-height: 1.1;
}
#rail button span {
  text-align: center;
}
#rail svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#side {
  background: var(--panel);
  border-left: 1px solid var(--line);
  padding: 10px 12px;
  overflow: auto;
  min-height: 0;
  font-size: 13px;
}
#side h3 {
  margin: 0 0 8px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#side h3 button {
  padding: 2px 8px;
  font-size: 12px;
  flex: none;
}
#side h3 input {
  width: 100%;
}
#side p {
  margin: 8px 0;
}
#side .m {
  color: var(--mute);
  font-size: 12px;
}
#side details {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
#side #propd {
  margin-top: 0;
  border-top: 0;
  padding-top: 0;
}
#side details.fsec {
  margin-top: 6px;
  padding-top: 4px;
}
#side details.fsec > summary {
  font-size: 12px;
  margin-bottom: 4px;
}
#side summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
}
#side .hd {
  margin: 10px 0 2px;
  font-size: 11px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
#side .it,
#side .cur {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
}
#side .it:hover {
  background: var(--btn);
}
#side .cur {
  background: var(--accent);
  color: #fff;
}
#side .cur .m {
  color: #fff;
}
#side .fgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin: 2px 0 8px;
}
#side .fgrid button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  padding: 5px 7px;
  line-height: 1.2;
}
#side .fgrid button small {
  opacity: 0.65;
  font-size: 10px;
}
#side .sws {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 2px 0 6px;
}
#side .sw {
  width: 17px;
  height: 17px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.3);
  cursor: pointer;
  display: inline-block;
}
#side .sw:hover {
  outline: 2px solid #2f6fdb;
}
#side .r {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
#side input,
#side select {
  width: 110px;
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 6px;
  font: inherit;
}
.pane {
  position: relative;
  min-height: 0;
  min-width: 0;
  border-right: 1px solid var(--line);
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.tag {
  position: absolute;
  left: 8px;
  top: 6px;
  font-size: 12px;
  color: var(--mute);
  pointer-events: none;
}
#fly {
  position: fixed;
  display: none;
  z-index: 20;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  min-width: 120px;
}
#fly div {
  font-size: 11px;
  color: var(--mute);
  margin: 0 2px 4px;
}
#fly button {
  display: block;
  width: 100%;
  margin: 2px 0;
  text-align: left;
}
#side .fb {
  justify-content: flex-start;
  margin: 4px 0;
}
#side .fb button {
  padding: 2px 8px;
  font-size: 12px;
}
#tb {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--mute);
  overflow-x: auto;
}
#bar .flb {
  padding: 2px 6px;
  font-size: 10px;
  line-height: 1;
  margin-left: 2px;
}
#tb button {
  padding: 2px 9px;
  font-size: 11px;
  border-radius: 12px;
  white-space: nowrap;
}
#tb span {
  margin-right: 4px;
}
#bld {
  margin: 0 0 0 auto;
  padding-left: 12px;
  white-space: nowrap;
  opacity: 0.75;
}
#st {
  display: none;
  padding: 6px 10px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  color: var(--mute);
  font-size: 12px;
  min-height: 28px;
}
@media (max-width: 800px) {
  #main,
  #main.nos {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr 1fr auto;
  }
  #main.nos {
    grid-template-rows: auto 1fr 1fr;
  }
  #main.v2d,
  #main.v3d,
  #main.v2d.nos,
  #main.v3d.nos {
    grid-template-columns: 1fr;
  }
  #main.v2d,
  #main.v3d {
    grid-template-rows: auto 1fr auto;
  }
  #main.v2d.nos,
  #main.v3d.nos {
    grid-template-rows: auto 1fr;
  }
  #split {
    display: none;
  }
  #rail,
  #p2,
  #p3,
  #side {
    grid-column: 1;
  }
  #rail {
    flex-direction: row;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  #rail button {
    width: 56px;
    flex: none;
  }
  #side {
    max-height: 34vh;
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .pane {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*
 * CADieux — single-file home design program.
 *
 * Layout of this script
 *   1. Model       M (floors: walls, rooms, stairs, roofs, foundations, fsys), undo/redo
 *   2. Geometry    wall geometry, openings, joints, framing, lumber helpers
 *   3. Properties  sidebar (renderSide) and floor/object lists
 *   4. 2D plan     canvas drawing, hit-testing, tools (wall, room, stairs, roof, foundation, joists)
 *   5. 3D view     three.js scene: walls, floor system, stairs, roofs, terrain, handles
 *   6. App         file menu, Random Build, keyboard shortcuts, startup
 */
const $ = (id) => document.getElementById(id);
const FH = 8.5,
  M = {
    floors: [{walls: [], rooms: [], stairs: []}],
    cf: 0,
    roof: {type: 'gable', pitch: 6},
    terr: {on: true, seed: 7},
    paths: [],
  };
['walls', 'rooms', 'stairs', 'roofs'].forEach((k) =>
  Object.defineProperty(M, k, {
    get() {
      const F = M.floors[M.cf];
      return F[k] || (F[k] = []);
    },
  }),
);
const OP = {door: [0, 6.67], window: [3, 6.67]},
  WH = 8;
let allAt = -1,
  roofAt = -1,
  undo = [],
  sel = null,
  drag = null,
  ZB = 0,
  TAG = null,
  meas = [],
  mA = null,
  tool = 'select',
  start = null,
  cur = [0, 0],
  roomPts = [],
  sc = 20,
  off = {x: 60, y: 400},
  pan = null,
  first = true;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const status = (s) => ($('st').textContent = s);
var VW = {grid: true, dims: true, labels: true, land: true, sky: true, roofs: true};
try {
  Object.assign(VW, JSON.parse(localStorage.getItem('cadieux.vw') || '{}'));
} catch (e) {}
const geom = (w) => {
  const [ax, ay] = w.a,
    [bx, by] = w.b,
    L = Math.hypot(bx - ax, by - ay) || 1e-9,
    d = [(bx - ax) / L, (by - ay) / L];
  return {ax, ay, L, d, n: [-d[1], d[0]]};
};
const inPoly = (p, P) => {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++)
    if (
      P[i][1] > p[1] !== P[j][1] > p[1] &&
      p[0] < ((P[j][0] - P[i][0]) * (p[1] - P[i][1])) / (P[j][1] - P[i][1]) + P[i][0]
    )
      c = !c;
  return c;
};
// +1 when the wall's left normal (+n) faces outside the building, -1 when it faces inside
function extSide(w, F) {
  F = F || M.floors[M.cf];
  const g = geom(w),
    mx = g.ax + g.d[0] * (g.L / 2),
    my = g.ay + g.d[1] * (g.L / 2),
    pa = [mx + g.n[0] * 0.5, my + g.n[1] * 0.5],
    pb = [mx - g.n[0] * 0.5, my - g.n[1] * 0.5],
    ins = (q) => F.rooms.some((r) => r.pts.length > 2 && inPoly(q, r.pts));
  const ia = ins(pa),
    ib = ins(pb);
  if (ia !== ib) return ia ? -1 : 1;
  const bx = bb(F.walls);
  if (!bx) return 1;
  const cx = (bx.x0 + bx.x1) / 2,
    cy = (bx.y0 + bx.y1) / 2;
  return (mx - cx) * g.n[0] + (my - cy) * g.n[1] >= 0 ? 1 : -1;
}
const hit = (p, w) => {
  const g = geom(w);
  let s = (p[0] - g.ax) * g.d[0] + (p[1] - g.ay) * g.d[1];
  s = Math.max(0, Math.min(g.L, s));
  return [Math.hypot(p[0] - g.ax - g.d[0] * s, p[1] - g.ay - g.d[1] * s), s / g.L];
};
const area = (P) =>
  Math.abs(
    P.reduce((a, p, i) => {
      const q = P[(i + 1) % P.length];
      return a + p[0] * q[1] - q[0] * p[1];
    }, 0),
  ) / 2;

/* keep doors and windows clear of wall junctions: any opening whose span would run into a wall ending on (or crossing) its wall,
   or into a corner, is slid to the nearest clear spot, or dropped when there is none */
function clearJunctions(F) {
  const MG = 0.3;
  F.walls.forEach((w) => {
    if (!w.open || !w.open.length) return;
    const dx = w.b[0] - w.a[0],
      dy = w.b[1] - w.a[1],
      L = Math.hypot(dx, dy);
    if (L < 0.5) return;
    const ux = dx / L,
      uy = dy / L,
      hit = [[0, w.t / 2]];
    hit.push([L, w.t / 2]);
    F.walls.forEach((v) => {
      if (v === w) return;
      [v.a, v.b].forEach((p) => {
        const px = p[0] - w.a[0],
          py = p[1] - w.a[1],
          u = px * ux + py * uy,
          d = Math.abs(-px * uy + py * ux);
        if (u > -0.5 && u < L + 0.5 && d <= (w.t + v.t) / 2 + 0.2) hit.push([u, v.t / 2]);
      });
    });
    const kept = [],
      free = (u, o) =>
        u - o.w / 2 >= MG &&
        u + o.w / 2 <= L - MG &&
        hit.every((h) => Math.abs(u - h[0]) >= o.w / 2 + h[1] + MG) &&
        kept.every((k) => Math.abs(u - k.t * L) >= (o.w + k.w) / 2 + 0.3);
    w.open.forEach((o) => {
      const u0 = o.t * L;
      let best = null;
      for (let d = 0; d <= L / 2 && best === null; d += 0.25)
        for (const s of d ? [-1, 1] : [1]) if (best === null && free(u0 + s * d, o)) best = u0 + s * d;
      if (best !== null) {
        o.t = best / L;
        kept.push(o);
      }
    });
    w.open = kept;
  });
}

function furnPts(o) {
  const t = (o.rot * Math.PI) / 180,
    c = Math.cos(t),
    s = Math.sin(t);
  return [
    [-o.w / 2, -o.d / 2],
    [o.w / 2, -o.d / 2],
    [o.w / 2, o.d / 2],
    [-o.w / 2, o.d / 2],
  ].map((p) => [o.c[0] + p[0] * c - p[1] * s, o.c[1] + p[0] * s + p[1] * c]);
}

      mid = [g.ax + g.d[0] * (g.L / 2), g.ay + g.d[1] * (g.L / 2)],
      k = w.t / 2 + 0.4,
      side = (s) => {
        const q = [mid[0] + g.n[0] * k * s, mid[1] + g.n[1] * k * s];

    status(e && e.code === 'declined' ? 'Download cancelled.' : 'File download is not available here.');
  }
}

(() => {
  const f = document.createElement('input');
  f.type = 'file';
  f.accept = '.json,application/json';
  f.style.display = 'none';
  document.body.appendChild(f);
  const ld = (t) => {
    try {
      const d = JSON.parse(t);
      if (!d || !(d.floors || d.walls)) throw 0;
      mut(() => setM(d));
      status('Project loaded.');
    } catch (e) {
      status('That file is not a CADieux project.');
    }
  };
  f.onchange = () => {
    const r = f.files[0];
    if (!r) return;
    const fr = new FileReader();
    fr.onload = () => ld(fr.result);
    fr.readAsText(r);
    f.value = '';
  };
  $('load').onclick = () => {
    $('filepop').classList.remove('open');
    try {
      f.click();
    } catch (e) {
      let s = null;
      try {
        s = localStorage.getItem('cadieux');
      } catch (x) {}
      if (s) ld(s);
      else status('Nothing saved yet.');
    }
  };
})();
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    $(e.shiftKey ? 'redo' : 'undo').click();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    $('redo').click();
    return;
  }
  const k = {
    w: 'wall',
    d: 'door',
    n: 'window',
    r: 'room',
    p: 'path',
    s: 'select',
    t: 'stairs',
    m: 'measure',
    f: 'roof',
    g: 'foundation',
    j: 'fsys',
    k: 'deck',
    c: 'cabinet',
  }[e.key.toLowerCase()];
  if (k && !e.ctrlKey && !e.metaKey) setTool(k);
  if (msLive().length && (e.key === 'Delete' || e.key === 'Backspace')) {
    delGroup();

  }
  if (sel && (e.key === 'Delete' || e.key === 'Backspace')) delSel();

  }

    fstart = null;
    jstart = null;
    dstart = null;

{
  const setSplit = (r) => {
    r = Math.max(0.15, Math.min(0.85, r));
    $('main').style.setProperty('--a', r.toFixed(4) + 'fr');
    $('main').style.setProperty('--b', (1 - r).toFixed(4) + 'fr');

  try {

  } catch (e) {}
  const sp = $('split');
  sp.onpointerdown = (e) => {
    e.preventDefault();
    sp.setPointerCapture(e.pointerId);
    sp.classList.add('drag');
  };
  sp.onpointermove = (e) => {
    if (!sp.classList.contains('drag')) return;
    const a = $('p2').getBoundingClientRect(),
      b = $('p3').getBoundingClientRect();
    setSplit((e.clientX - a.left) / (b.right - a.left));
    size2();
    size3();
  };
  sp.onpointerup = sp.onpointercancel = (e) => {
    if (!sp.classList.contains('drag')) return;
    sp.classList.remove('drag');
    const a = $('p2').getBoundingClientRect(),
      b = $('p3').getBoundingClientRect();
    try {
      localStorage.setItem('cadieux.split', String((a.width / (b.right - a.left)).toFixed(4)));
    } catch (x) {}
  };
  sp.ondblclick = () => {
    setSplit(0.5);
    try {
      localStorage.removeItem('cadieux.split');
    } catch (x) {}
    size2();
    size3();
  };
}
