<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CADieux</title>
<meta name="theme-color" content="#1e293b">
<meta name="description" content="CADieux - 2D plan and 3D home design with framing, roofs, stairs, decks, cabinets and a materials list.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root {
  --bg: #f6f6f2;
  --panel: #fff;
  --ink: #222;
  --mute: #666;
  --line: #d8d8d0;
  --grid: #e2e2da;
  --grid5: #c9c9bf;
  --wall: #5a5a5f;
  --room: #dfe9f4;
  --accent: #2f6fdb;
  --btn: #ecece6;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c1f;
    --panel: #25262a;
    --ink: #eee;
    --mute: #9a9a9a;
    --line: #3a3b40;
    --grid: #2e2f34;
    --grid5: #44464c;
    --wall: #b8b8c0;
    --room: #2c3a4d;
    --btn: #33353b;
  }
}
* {
  box-sizing: border-box;
}
html,
body {
  height: 100%;
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font:
    14px system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;
}
body {
  display: flex;
  flex-direction: column;
  height: 100%;
}
#logo {
  width: 36px;
  height: 36px;
  flex: none;
  border: 1px dashed var(--line);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
  font-size: 9px;
  color: var(--mute);
  letter-spacing: 0.5px;
}
#logo img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
}
#bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 8px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  align-items: center;
}
button {
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  font: inherit;
  cursor: pointer;
}
#filem {
  position: relative;
}
#filepop {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  margin-top: 4px;
  z-index: 50;
  flex-direction: column;
  gap: 2px;
  padding: 4px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
  min-width: 110px;
}
#filepop.open {
  display: flex;
}
#filepop button {
  text-align: left;
}
#vm {
  display: inline-flex;
}
#vm button {
  border-radius: 0;
  margin-left: -1px;
}
#vm button:first-child {
  border-radius: 6px 0 0 6px;
  margin-left: 0;
}
#vm button:last-child {
  border-radius: 0 6px 6px 0;
}
button.on {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
}
select {
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px;
  font: inherit;
}
.sep {
  width: 1px;
  height: 22px;
  background: var(--line);
  margin: 0 4px;
}
#main {
  flex: 1;
  display: grid;
  grid-template-columns: 52px 1fr 1fr 250px;
  min-height: 0;
}
#main.nos {
  grid-template-columns: 52px 1fr 1fr;
}
#main.nos #side {
  display: none;
}
#rail {
  grid-column: 1;
}
#p2 {
  grid-column: 2;
}
#p3 {
  grid-column: 3;
}
#side {
  grid-column: 4;
}
#main.v2d {
  grid-template-columns: 52px 1fr 0 250px;
}
#main.v3d {
  grid-template-columns: 52px 0 1fr 250px;
}
#main.v2d.nos {
  grid-template-columns: 52px 1fr 0;
}
#main.v3d.nos {
  grid-template-columns: 52px 0 1fr;
}
#main.v2d #p3,
#main.v3d #p2 {
  display: none;
}
#rail {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 6px 4px;
  background: var(--panel);
  border-right: 1px solid var(--line);
  overflow: auto;
}
#rail button {
  width: 100%;
  padding: 6px 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  font-size: 10px;
  line-height: 1.1;
}
#rail button span {
  text-align: center;
}
#rail svg {
  width: 22px;
  height: 22px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
#side {
  background: var(--panel);
  border-left: 1px solid var(--line);
  padding: 10px 12px;
  overflow: auto;
  min-height: 0;
  font-size: 13px;
}
#side h3 {
  margin: 0 0 8px;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
#side h3 button {
  padding: 2px 8px;
  font-size: 12px;
  flex: none;
}
#side h3 input {
  width: 100%;
}
#side p {
  margin: 8px 0;
}
#side .m {
  color: var(--mute);
  font-size: 12px;
}
#side details {
  margin-top: 12px;
  border-top: 1px solid var(--line);
  padding-top: 8px;
}
#side summary {
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 6px;
}
#side .hd {
  margin: 10px 0 2px;
  font-size: 11px;
  color: var(--mute);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
#side .it,
#side .cur {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
}
#side .it:hover {
  background: var(--btn);
}
#side .cur {
  background: var(--accent);
  color: #fff;
}
#side .cur .m {
  color: #fff;
}
#side .fgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  margin: 2px 0 8px;
}
#side .fgrid button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  text-align: left;
  padding: 5px 7px;
  line-height: 1.2;
}
#side .fgrid button small {
  opacity: 0.65;
  font-size: 10px;
}
#side .sws {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 2px 0 6px;
}
#side .sw {
  width: 17px;
  height: 17px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.3);
  cursor: pointer;
  display: inline-block;
}
#side .sw:hover {
  outline: 2px solid #2f6fdb;
}
#side .r {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin: 6px 0;
}
#side input,
#side select {
  width: 110px;
  background: var(--btn);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 4px 6px;
  font: inherit;
}
.pane {
  position: relative;
  min-height: 0;
  min-width: 0;
  border-right: 1px solid var(--line);
}
canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}
.tag {
  position: absolute;
  left: 8px;
  top: 6px;
  font-size: 12px;
  color: var(--mute);
  pointer-events: none;
}
#fly {
  position: fixed;
  display: none;
  z-index: 20;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
  min-width: 120px;
}
#fly div {
  font-size: 11px;
  color: var(--mute);
  margin: 0 2px 4px;
}
#fly button {
  display: block;
  width: 100%;
  margin: 2px 0;
  text-align: left;
}
#side .fb {
  justify-content: flex-start;
  margin: 4px 0;
}
#side .fb button {
  padding: 2px 8px;
  font-size: 12px;
}
#st {
  padding: 6px 10px;
  background: var(--panel);
  border-top: 1px solid var(--line);
  color: var(--mute);
  font-size: 12px;
  min-height: 28px;
}
@media (max-width: 800px) {
  #main,
  #main.nos {
    grid-template-columns: 1fr;
    grid-template-rows: auto 1fr 1fr auto;
  }
  #main.nos {
    grid-template-rows: auto 1fr 1fr;
  }
  #main.v2d,
  #main.v3d,
  #main.v2d.nos,
  #main.v3d.nos {
    grid-template-columns: 1fr;
  }
  #main.v2d,
  #main.v3d {
    grid-template-rows: auto 1fr auto;
  }
  #main.v2d.nos,
  #main.v3d.nos {
    grid-template-rows: auto 1fr;
  }
  #rail,
  #p2,
  #p3,
  #side {
    grid-column: 1;
  }
  #rail {
    flex-direction: row;
    border-right: 0;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
  }
  #rail button {
    width: 56px;
    flex: none;
  }
  #side {
    max-height: 34vh;
    border-left: 0;
    border-top: 1px solid var(--line);
  }
  .pane {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }
}
</style>
</head>

<script>/*
 * CADieux — single-file home design program.
 *
 * Layout of this script
 *   1. Model       M (floors: walls, rooms, stairs, roofs, foundations, fsys), undo/redo
 *   2. Geometry    wall geometry, openings, joints, framing, lumber helpers
 *   3. Properties  sidebar (renderSide) and floor/object lists
 *   4. 2D plan     canvas drawing, hit-testing, tools (wall, room, stairs, roof, foundation, joists)
 *   5. 3D view     three.js scene: walls, floor system, stairs, roofs, terrain, handles
 *   6. App         file menu, Random Build, keyboard shortcuts, startup
 */
const $ = (id) => document.getElementById(id);
const FH = 8.5,
  M = {
    floors: [{walls: [], rooms: [], stairs: []}],
    cf: 0,
    roof: {type: 'gable', pitch: 6},
    terr: {on: true, seed: 7},
  };
['walls', 'rooms', 'stairs', 'roofs'].forEach((k) =>
  Object.defineProperty(M, k, {
    get() {
      const F = M.floors[M.cf];
      return F[k] || (F[k] = []);
    },
  }),
);
const OP = {door: [0, 6.67], window: [3, 6.67]},
  WH = 8;
let allAt = -1,
  roofAt = -1,
  undo = [],
  sel = null,
  drag = null,
  ZB = 0,
  TAG = null,
  meas = [],
  mA = null,
  tool = 'select',
  start = null,
  cur = [0, 0],
  roomPts = [],
  sc = 20,
  off = {x: 60, y: 400},
  pan = null,
  first = true;
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const status = (s) => ($('st').textContent = s);
const geom = (w) => {
  const [ax, ay] = w.a,
    [bx, by] = w.b,
    L = Math.hypot(bx - ax, by - ay) || 1e-9,
    d = [(bx - ax) / L, (by - ay) / L];
  return {ax, ay, L, d, n: [-d[1], d[0]]};
};
const hit = (p, w) => {
  const g = geom(w);
  let s = (p[0] - g.ax) * g.d[0] + (p[1] - g.ay) * g.d[1];
  s = Math.max(0, Math.min(g.L, s));
  return [Math.hypot(p[0] - g.ax - g.d[0] * s, p[1] - g.ay - g.d[1] * s), s / g.L];
};
const area = (P) =>
  Math.abs(
    P.reduce((a, p, i) => {
      const q = P[(i + 1) % P.length];
      return a + p[0] * q[1] - q[0] * p[1];
    }, 0),
  ) / 2;
function endExt(w, list, atEnd) {
  const p = atEnd ? w.b : w.a,
    eq = (u, v) => u[0] === v[0] && u[1] === v[1],
    o = list.find((v) => v !== w && (eq(v.a, p) || eq(v.b, p)));
  if (!o || list.indexOf(w) > list.indexOf(o)) return 0;
  const g = geom(w),
    q = geom(o),
    s = atEnd ? 1 : -1,
    t = eq(o.a, p) ? 1 : -1,
    cr = Math.abs(g.d[0] * q.d[1] - g.d[1] * q.d[0]),
    dt = s * t * (g.d[0] * q.d[0] + g.d[1] * q.d[1]),
    phi = Math.atan2(cr, dt);
  if (phi < 0.02 || phi > 2.6) return 0;
  const e = (o.t / 2 - (w.t / 2) * Math.cos(phi)) / Math.sin(phi);
  return Math.max(0, Math.min(1.5 * Math.max(w.t, o.t), e));
}
function lumber(w) {
  const n = w.sz || (w.t >= 0.5 ? '2x6' : '2x4');
  return {n: n, d: n === '2x6' ? 5.5 / 12 : 3.5 / 12};
}
function framing(w) {
  const g = geom(w),
    L = g.L,
    H = w.h,
    T = 0.125,
    m = [],
    S = 4 / 3,
    ops = [...w.open]
      .sort((a, b) => a.t - b.t)
      .map((o) => {
        const c = o.t * L,
          w2 = o.w / 2,
          win = o.kind === 'window';
        return {
          a: Math.max(0, c - w2),
          b: Math.min(L, c + w2),
          sill: win ? WSILL[o.wt || 'dh'] : 0,
          head: win ? OP.window[1] : o.dt === 'garage' ? 7 : OP.door[1],
          win,
        };
      }),
    add = (s0, s1, z0, z1, k) => {
      if (s1 - s0 > 1e-6 && z1 - z0 > 1e-6) m.push({s0, s1, z0, z1, k});
    };
  add(0, L, H - 0.25, H, 'p');
  let c = 0;
  ops.forEach((o) => {
    if (!o.win) {
      add(c, o.a, 0, T, 'p');
      c = o.b;
    }
  });
  add(c, L, 0, T, 'p');
  const inZ = (x) => ops.some((o) => x > o.a - 3 * T && x < o.b + 3 * T);
  for (let p = 0; p < L - T; p += S) if (!inZ(p + T / 2)) add(p, p + T, T, H - 0.25, 's');
  if (!inZ(L - T / 2)) add(L - T, L, T, H - 0.25, 's');
  ops.forEach((o) => {
    add(o.a - 2 * T, o.a - T, T, H - 0.25, 'k');
    add(o.b + T, o.b + 2 * T, T, H - 0.25, 'k');
    add(o.a - T, o.a, T, o.head, 'j');
    add(o.b, o.b + T, T, o.head, 'j');
    add(o.a - 2 * T, o.b + 2 * T, o.head, o.head + 0.5, 'h');
    let ps = [];
    for (let p = 0; p < L; p += S) if (p > o.a + T && p < o.b - 2 * T) ps.push(p);
    if (!ps.length && o.b - o.a > 3 * T) ps = [(o.a + o.b) / 2 - T / 2];
    if (o.head + 0.5 < H - 0.25) ps.forEach((p) => add(p, p + T, o.head + 0.5, H - 0.25, 'c'));
    if (o.win && o.sill > 0.5) {
      add(o.a, o.b, o.sill - T, o.sill, 'h');
      ps.forEach((p) => add(p, p + T, T, o.sill - T, 'c'));
    }
  });
  return m;
}
function pieces(w, list) {
  const g = geom(w),
    out = [],
    E = list ? endExt(w, list, 1) : 0,
    E0 = list ? endExt(w, list, 0) : 0;
  let c = 0;
  [...w.open]
    .sort((a, b) => a.t - b.t)
    .forEach((o) => {
      const m = o.t * g.L,
        s0 = Math.max(0, m - o.w / 2),
        s1 = Math.min(g.L, m + o.w / 2),
        [sill, head] = [
          o.kind === 'window' ? WSILL[o.wt || 'dh'] : OP[o.kind][0],
          o.dt === 'garage' ? 7 : OP[o.kind][1],
        ];
      if (s0 > c) out.push([c, s0, 0, w.h]);
      if (sill > 0) out.push([s0, s1, 0, sill]);
      if (head < w.h) out.push([s0, s1, head, w.h]);
      c = s1;
    });
  if (c < g.L) out.push([c, g.L, 0, w.h]);

/* save a file: desktop app dialog when running in the installed app, else the page's downloads capability */
async function saveFile(name, data) {
  if (window.cadieuxAndroid) {
    /* the Android app shows its own "save to..." screen and reports back through __androidSave */
    return new Promise((res, rej) => {
      window.__androidSave = {res, rej};
      window.cadieuxAndroid.save(name, data);
    });
  }
  if (window.cadieuxDesktop) {
    const r = await window.cadieuxDesktop.save(name, data);
    if (!r) throw {code: 'declined'};
    return r;
  }
  const d = window.claude && (await window.claude.use('downloads'));
  if (d) {
    await d.save({filename: name, data});
    return name;
  }
  /* ordinary website: hand the file to the browser as a download */
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type: 'application/octet-stream'}));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  return name;
}

    L = [['Section', 'Item', 'Size', 'Cut length (ft)', 'Qty'].map(q).join(',')];
  D.cut.forEach((r) =>
    L.push([r.cat, r.item, r.size, Math.round(r.len * 100) / 100, r.qty].map(q).join(',')),
  );
  D.sheets.forEach((r) => L.push([r.cat, r.item, '4x8 sheet', '', r.qty].map(q).join(',')));
  L.push('', ['Purchase summary', '', 'Size', 'Stock length (ft)', 'Qty', 'Board ft'].map(q).join(','));
  D.purchase.forEach((r) =>
    L.push(['Purchase', '', r.size, r.stock, r.qty, Math.round(r.bf * 10) / 10].map(q).join(',')),
  );
  return L.join('\n');
}

    'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:flex;align-items:center;justify-content:center';

    '<div style="background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:280px;box-shadow:0 8px 30px rgba(0,0,0,.3)"><div style="font-weight:600;margin-bottom:8px">Save project as</div><div style="display:flex;align-items:center;gap:6px"><input id=sa_n style="flex:1;padding:6px"><span>.json</span></div><div style="display:flex;justify-content:flex-end;gap:6px;margin-top:12px"><button id=sa_c>Cancel</button><button id=sa_ok class=on>Save</button></div></div>';
  document.body.appendChild(o);

  n.focus();

  const done = (ok) => {
    const v = n.value
      .trim()
      .replace(/\.json$/i, '')
      .replace(/[\\/:*?"<>|]/g, '_');
    o.remove();
    if (ok && v) doSave(v);
  };
  o.querySelector('#sa_c').onclick = () => done(false);
  o.querySelector('#sa_ok').onclick = () => done(true);
  n.onkeydown = (e) => {

  };
};
(() => {
  const f = document.createElement('input');
  f.type = 'file';
  f.accept = '.json,application/json';
  f.style.display = 'none';
  document.body.appendChild(f);
  const ld = (t) => {
    try {
      const d = JSON.parse(t);
      if (!d || !(d.floors || d.walls)) throw 0;
      mut(() => setM(d));
      status('Project loaded.');
    } catch (e) {
      status('That file is not a CADieux project.');
    }
  };
  f.onchange = () => {
    const r = f.files[0];
    if (!r) return;
    const fr = new FileReader();
    fr.onload = () => ld(fr.result);
    fr.readAsText(r);
    f.value = '';
  };
  $('load').onclick = () => {
    $('filepop').classList.remove('open');
    try {
      f.click();
    } catch (e) {
      let s = null;
      try {
        s = localStorage.getItem('cadieux');
      } catch (x) {}
      if (s) ld(s);
      else status('Nothing saved yet.');
    }
  };
})();
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
    $(e.shiftKey ? 'redo' : 'undo').click();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
    $('redo').click();
    return;
  }
  const k = {
    w: 'wall',
    d: 'door',
    n: 'window',
    r: 'room',
    s: 'select',
    t: 'stairs',
    m: 'measure',
    f: 'roof',
    g: 'foundation',
    j: 'fsys',
    k: 'deck',
    c: 'cabinet',
  }[e.key.toLowerCase()];
  if (k && !e.ctrlKey && !e.metaKey) setTool(k);
  if (msLive().length && (e.key === 'Delete' || e.key === 'Backspace')) {
    delGroup();
    return;
  }
  if (sel && (e.key === 'Delete' || e.key === 'Backspace')) delSel();
  if (tool === 'furn' && e.key.toLowerCase() === 'q') {
    furnRot = (furnRot + 90) % 360;
    draw2();
  }
  if (sel && tool === 'select') {
    if (e.key.toLowerCase() === 'q' && sel.t === 'stair') mut(() => (sel.o.rot = (sel.o.rot + 1) % 4));
    if (e.key.toLowerCase() === 'q' && sel.t === 'fu') mut(() => (sel.o.rot = (sel.o.rot + 90) % 360));
  }
  if (e.key === 'Escape') {
    start = null;
    roomPts = [];
    mA = null;
    rstart = null;
    fstart = null;
    jstart = null;
    dstart = null;
    cstart = null;
    msel = [];
    renderSide();
    draw2();
  }
  if (e.key === 'Enter' && tool === 'room') finishRoom();
});
